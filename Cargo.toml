[workspace]
members = [".", "xtask"]
resolver = "3"

[package]
name = "whatsapp-video-preparer"
version = "2.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "Rust desktop app for preparing size-safe WhatsApp video clips"
license = "MIT"
repository = "https://github.com/KaspaPulse/whatsapp-video-preparer"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
iced = { version = "0.14.0", default-features = false, features = ["tokio", "image", "tiny-skia"] }
opener = "0.8.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
