name: Rust macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rust-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            helper_platform: macos-arm64
          - runner: macos-15-intel
            helper_platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Repository and KSSS gate
        run: cargo run -p xtask --locked -- verify

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Build release executable
        run: cargo build --release --locked -p media-studio

      - name: Package native app with pinned media helpers
        run: cargo run -p xtask --locked -- package-macos "${{ matrix.helper_platform }}" target/release/media-studio .artifacts/package

      - name: Real size-budget regression test
        run: cargo run -p xtask --locked -- verify-size-budget-package .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}/KaspaPulseMediaStudio.app

      - name: Native GUI startup smoke
        run: cargo run -p xtask --locked -- smoke .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}/KaspaPulseMediaStudio.app/Contents/MacOS/KaspaPulseMediaStudio

      - name: Generate SPDX 2.3 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.52.0

      - name: Upload qualified macOS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KaspaPulseMediaStudio-${{ matrix.helper_platform }}-${{ github.sha }}
          path: |
            .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.dmg
            .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.dmg.sha256
            .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.spdx.json
            .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        helper_platform: [macos-arm64, macos-x64]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download qualified macOS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: KaspaPulseMediaStudio-${{ matrix.helper_platform }}-${{ github.sha }}
          path: .artifacts/package

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.dmg

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.dmg
          sbom-path: .artifacts/package/KaspaPulseMediaStudio-${{ matrix.helper_platform }}.spdx.json
