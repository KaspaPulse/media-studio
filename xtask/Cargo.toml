[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
