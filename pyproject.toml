[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-video-preparer"
version = "1.4.1"
description = "Windows and macOS GUI for preparing downloaded videos as WhatsApp-ready custom-duration clips"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.9,<7",
  "yt-dlp>=2026.8.19",
  "imageio-ffmpeg>=0.6,<1",
]

[project.scripts]
whatsapp-video-preparer = "whatsapp_video_preparer.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
