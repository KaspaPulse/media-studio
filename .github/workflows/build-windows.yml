name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        shell: powershell
        run: .\build.ps1
      - name: Verify EXE starts
        shell: powershell
        run: |
          $exe = Resolve-Path 'dist\WhatsAppVideoPreparer.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "EXE exited early with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'EXE remained running for 8 seconds.'
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppVideoPreparer-Windows
          path: dist/WhatsAppVideoPreparer.exe
          if-no-files-found: error
