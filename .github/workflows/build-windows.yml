name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        shell: powershell
        run: .\build.ps1
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppVideoPreparer-Windows
          path: dist/WhatsAppVideoPreparer.exe
          if-no-files-found: error
